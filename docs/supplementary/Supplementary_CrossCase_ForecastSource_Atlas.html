function scatter(id,rows,xk,yk,xlab,ylab,wide=false,coverage=false){const svg=$(id);svg.replaceChildren();const W=wide?1160:460,H=wide?440:370,p={l:78,r:24,t:25,b:77};let [lo,hi]=bounds(rows.map(r=>+r[xk]),true),[yl,yh]=bounds(rows.map(r=>+r[yk]),true);if(coverage){yl=0;yh=1}const sx=v=>p.l+(v-lo)/(hi-lo)*(W-p.l-p.r),sy=v=>H-p.b-(v-yl)/(yh-yl)*(H-p.t-p.b);for(let i=0;i<=4;i++){const vx=lo+(hi-lo)*i/4,vy=yl+(yh-yl)*i/4;S('line',{x1:sx(vx),x2:sx(vx),y1:p.t,y2:H-p.b,stroke:'#e5e9eb'},svg);S('line',{x1:p.l,x2:W-p.r,y1:sy(vy),y2:sy(vy),stroke:'#e5e9eb'},svg);text(svg,sx(vx),H-p.b+25,fmt(vx));text(svg,p.l-12,sy(vy)+5,fmt(vy),'end')}text(svg,(p.l+W-p.r)/2,H-18,xlab);text(svg,19,(p.t+H-p.b)/2,ylab,'middle',{transform:`rotate(-90 19 ${(p.t+H-p.b)/2})`});if(coverage){S('line',{x1:p.l,x2:W-p.r,y1:sy(.9),y2:sy(.9),stroke:'#202b31','stroke-dasharray':'5 5'},svg);text(svg,W-p.r,sy(.9)-10,'Nominal 0.9','end')}

 select('method','Methods',[['all','Both recorded methods (aggregate)']]);select('family','Case family',[['all','All 18 cases'],...[...new Set(D.rows.map(r=>r.family))].sort().map(x=>[x,x.replaceAll('_',' ')])]);$('plots').style.gridTemplateColumns='1fr';panel('cross','Forecast source comparison');$('intro').textContent='Compare the archived aggregate across two recorded methods: analysis-isolated forecasts (shadow) and observation-corrected analysis branches at two observation intervals.';
